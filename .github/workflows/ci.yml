name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"

jobs:
  godot-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Import project
        run: |
          GODOT=godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit

  godot-tests:
    runs-on: ubuntu-latest
    needs: godot-import
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Import project
        run: |
          GODOT=godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit
      - name: Run tests with log validation
        run: |
          GODOT=godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          python tools/python/run_godot_tests.py --godot "$GODOT" --expected-tests 295 --max-objectdb-leaks 0 --max-resource-leaks 0
      - name: Upload Godot test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-log
          path: artifacts/godot-test.log
          if-no-files-found: error

  npc-cognition-cross-process-e2e:
    runs-on: ubuntu-latest
    needs: godot-import
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stillpoint
          POSTGRES_PASSWORD: stillpoint
          POSTGRES_DB: stillpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stillpoint -d stillpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NPC_E2E_DATABASE_URL: postgresql+psycopg://stillpoint:stillpoint@127.0.0.1:5432/stillpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/npc_mind/pyproject.toml
      - name: Install deterministic Backend dependencies
        run: python -m pip install -e "services/npc_mind[test]"
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Run real Godot HTTP PostgreSQL acceptance
        run: |
          GODOT=godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          python tools/python/run_npc_cognition_cross_process_e2e.py \
            --godot "$GODOT" \
            --database-url "$NPC_E2E_DATABASE_URL" \
            --postgres-already-running
      - name: Print relevant failure logs
        if: failure()
        run: |
          for log in artifacts/npc-cognition-cross-process-e2e/*.log; do
            test -f "$log" || continue
            echo "===== $log ====="
            tail -n 80 "$log"
          done
      - name: Check for orphan Uvicorn processes
        if: always()
        run: |
          if pgrep -f '[u]vicorn app.main:app'; then
            echo "orphan Uvicorn process detected"
            exit 1
          fi
      - name: Upload cross-process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npc-cognition-cross-process-e2e-logs
          path: artifacts/npc-cognition-cross-process-e2e/
          if-no-files-found: error

  export-linux:
    runs-on: ubuntu-latest
    needs: godot-tests
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Download export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -L -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -o templates.tpz -d templates_out
          cp -r templates_out/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Linux debug export
        run: |
          mkdir -p builds
          GODOT=godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit
          "$GODOT" --headless --path . --export-debug "Linux" builds/stillpoint_linux.x86_64
          test -f builds/stillpoint_linux.x86_64
      - name: Scan Linux export for Backend source and secrets
        run: python tools/python/scan_export_artifact.py builds/stillpoint_linux.x86_64
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: stillpoint-linux-debug
          path: builds/stillpoint_linux.x86_64
          if-no-files-found: error

  export-windows:
    runs-on: ubuntu-latest
    needs: godot-tests
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Download export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -L -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -o templates.tpz -d templates_out
          cp -r templates_out/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Windows debug export
        run: |
          mkdir -p builds
          GODOT=godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --quit
          "$GODOT" --headless --path . --export-debug "Windows Desktop" builds/stillpoint_windows.exe
          test -f builds/stillpoint_windows.exe
      - name: Scan Windows export for Backend source and secrets
        run: python tools/python/scan_export_artifact.py builds/stillpoint_windows.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: stillpoint-windows-debug
          path: builds/stillpoint_windows.exe
          if-no-files-found: error

  legacy-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/python-tkinter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install legacy prototype (reference only)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  repo-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository hygiene
        run: python tools/python/validate_repo.py

  npc-mind-backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      NPC_REPOSITORY: in_memory
      NPC_MIND_SIGNING_KEY: ci-test-signing-key
    defaults:
      run:
        working-directory: services/npc_mind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/npc_mind/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[test]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

  npc-mind-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stillpoint
          POSTGRES_PASSWORD: stillpoint
          POSTGRES_DB: stillpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stillpoint -d stillpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/npc_mind
    env:
      APP_ENV: test
      NPC_REPOSITORY: postgres
      NPC_MIND_SIGNING_KEY: ci-test-signing-key
      DATABASE_URL: postgresql+psycopg://stillpoint:stillpoint@127.0.0.1:5432/stillpoint
      NPC_TEST_DATABASE_URL: postgresql+psycopg://stillpoint:stillpoint@127.0.0.1:5432/stillpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/npc_mind/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[test]"
      - name: Alembic upgrade, downgrade, upgrade
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head
      - name: PostgreSQL restart-persistence and isolation tests
        run: pytest -q

  npc-cognition-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: python -m pip install -e "services/npc_mind[test]"
      - name: Validate request, response, and catalog contract
        run: python tools/python/validate_npc_cognition_contract.py

  npc-catalog-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot/
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o godot.zip -d godot
          chmod +x godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Import project
        run: godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Export and validate NPC catalog
        run: |
          GODOT=godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          "$GODOT" --headless --path . --script res://tools/godot/export_npc_cognition_catalog.gd
          "$GODOT" --headless --path . --script res://tools/godot/export_npc_cognition_catalog.gd -- --check
