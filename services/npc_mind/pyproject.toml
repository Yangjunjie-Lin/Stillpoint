[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stillpoint-npc-mind"
version = "0.8.0"
description = "Stillpoint NPC cognitive identity, graph, dialogue, and memory backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.5,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0,<3", "asyncpg>=0.29,<1", "pgvector>=0.2,<1", "alembic>=1.13,<2"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
