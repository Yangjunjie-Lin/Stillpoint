services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stillpoint
      POSTGRES_PASSWORD: stillpoint
      POSTGRES_DB: stillpoint
    ports: ["55432:5432"]
  npc-mind:
    build: .
    depends_on: [postgres]
    ports: ["8443:8443"]
    environment:
      APP_ENV: development
      NPC_REPOSITORY: postgres
      DATABASE_URL: postgresql+psycopg://stillpoint:stillpoint@postgres:5432/stillpoint
      NPC_MIND_SIGNING_KEY: development-only-change-me
